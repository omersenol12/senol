<script>
'use strict';
// ===================== Küçük 3B motor (WebGL2, bağımlılık yok) =====================
const M4 = (() => {
  const tmp = new Float32Array(16);
  function mul(a, b, out) {
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      tmp[c * 4 + r] = s;
    }
    out = out || new Float32Array(16); out.set(tmp); return out;
  }
  // Unity sırası: R = Ry * Rx * Rz (derece değil radyan)
  function trs(o, px, py, pz, rx, ry, rz, sx, sy, sz) {
    const cx = Math.cos(rx), sxn = Math.sin(rx), cy = Math.cos(ry), syn = Math.sin(ry), cz = Math.cos(rz), szn = Math.sin(rz);
    o[0] = (cy * cz + syn * sxn * szn) * sx; o[1] = (cx * szn) * sx; o[2] = (-syn * cz + cy * sxn * szn) * sx; o[3] = 0;
    o[4] = (-cy * szn + syn * sxn * cz) * sy; o[5] = (cx * cz) * sy; o[6] = (syn * szn + cy * sxn * cz) * sy; o[7] = 0;
    o[8] = (syn * cx) * sz; o[9] = (-sxn) * sz; o[10] = (cy * cx) * sz; o[11] = 0;
    o[12] = px; o[13] = py; o[14] = pz; o[15] = 1;
    return o;
  }
  function persp(fov, aspect, n, f) {
    const t = 1 / Math.tan(fov / 2), o = new Float32Array(16);
    o[0] = t / aspect; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o;
  }
  // Sol-elli dünya: +x ekranda sağda. Ayna matris olduğu için yüz ayıklama kapalı.
  function look(e, t) {
    let fx = t[0] - e[0], fy = t[1] - e[1], fz = t[2] - e[2];
    const fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
    let sx = fz, sy = 0, sz = -fx; // up(0,1,0) x f
    const sl = Math.hypot(sx, sy, sz) || 1; sx /= sl; sy /= sl; sz /= sl;
    const ux = fy * sz - fz * sy, uy = fz * sx - fx * sz, uz = fx * sy - fy * sx;
    const o = new Float32Array(16);
    o[0] = sx; o[4] = sy; o[8] = sz; o[12] = -(sx * e[0] + sy * e[1] + sz * e[2]);
    o[1] = ux; o[5] = uy; o[9] = uz; o[13] = -(ux * e[0] + uy * e[1] + uz * e[2]);
    o[2] = -fx; o[6] = -fy; o[10] = -fz; o[14] = (fx * e[0] + fy * e[1] + fz * e[2]);
    o[15] = 1; return o;
  }
  return { mul, trs, persp, look };
})();

class Node {
  constructor(name, mesh) {
    this.name = name || ''; this.p = [0, 0, 0]; this.r = [0, 0, 0]; this.s = [1, 1, 1];
    this.children = []; this.parent = null; this.mesh = mesh || null;
    this.color = [1, 1, 1]; this.emis = [0, 0, 0]; this.alpha = 1; this.visible = true;
    this.additive = false; this.unlit = false; this.sky = false;
    this.world = new Float32Array(16); this.ws = [1, 1, 1]; this._l = new Float32Array(16);
  }
  add(c) { c.parent = this; this.children.push(c); return c; }
  remove(c) { const i = this.children.indexOf(c); if (i >= 0) { this.children.splice(i, 1); c.parent = null; } }
  find(path) { let n = this; for (const part of path.split('/')) { n = n.children.find(c => c.name === part); if (!n) return null; } return n; }
  update(pw, pws) {
    M4.trs(this._l, this.p[0], this.p[1], this.p[2], this.r[0], this.r[1], this.r[2], this.s[0], this.s[1], this.s[2]);
    if (pw) M4.mul(pw, this._l, this.world); else this.world.set(this._l);
    this.ws = pws ? [pws[0] * this.s[0], pws[1] * this.s[1], pws[2] * this.s[2]] : this.s.slice();
    for (const c of this.children) c.update(this.world, this.ws);
  }
  worldPos() { return [this.world[12], this.world[13], this.world[14]]; }
}
const DEG = Math.PI / 180;

class Renderer {
  constructor(canvas) {
    const gl = this.gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
    if (!gl) throw new Error('WebGL2 desteklenmiyor');
    this.canvas = canvas;
    const vs = `#version 300 es
in vec3 aPos; in vec3 aNor; in vec3 aCol;
uniform mat4 uVP; uniform mat4 uModel; uniform vec3 uScale;
out vec3 vN; out vec3 vW; out vec3 vC;
void main(){ vec4 w = uModel*vec4(aPos,1.0); vW=w.xyz; vC=aCol;
  vN = mat3(uModel)*(aNor/max(uScale*uScale,vec3(0.0001))); gl_Position = uVP*w; }`;
    const fs = `#version 300 es
precision highp float;
in vec3 vN; in vec3 vW; in vec3 vC;
uniform vec3 uColor; uniform vec3 uEmis; uniform float uAlpha; uniform int uMode; // 0 lit,1 unlit,2 sky
uniform vec3 uSun; uniform vec3 uSunCol; uniform vec3 uCam; uniform vec3 uFog; uniform float uFogD;
uniform vec3 uSkyTop; uniform vec3 uSkyHor;
out vec4 o;
void main(){
  vec3 base = uColor*vC;
  if(uMode==2){ vec3 d=normalize(vW-uCam); float h=clamp(d.y*1.6,0.0,1.0); vec3 c=mix(uSkyHor,uSkyTop,pow(h,0.6));
    float s=max(dot(d,normalize(uSun)),0.0); c+=uSunCol*(pow(s,600.0)*2.0+pow(s,12.0)*0.25); o=vec4(c,1.0); return; }
  vec3 col;
  if(uMode==1){ col = base+uEmis; }
  else {
    vec3 n=normalize(vN); vec3 v=normalize(uCam-vW); if(dot(n,v)<0.0) n=-n;
    float d=max(dot(n,normalize(uSun)),0.0);
    vec3 amb = mix(vec3(0.30,0.28,0.24), vec3(0.50,0.62,0.82), n.y*0.5+0.5);
    col = base*(amb*0.9 + uSunCol*d*0.95) + uEmis;
  }
  float dist=length(uCam-vW); float f=1.0-exp(-uFogD*dist*uFogD*dist*0.55-uFogD*dist*0.35); f=clamp(f,0.0,1.0);
  if(uMode==1 && uAlpha<1.0) f*=0.4;
  o = vec4(mix(col,uFog,f), uAlpha);
}`;
    const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
    const pr = this.prog = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    this.u = {}; for (const n of ['uVP', 'uModel', 'uScale', 'uColor', 'uEmis', 'uAlpha', 'uMode', 'uSun', 'uSunCol', 'uCam', 'uFog', 'uFogD', 'uSkyTop', 'uSkyHor']) this.u[n] = gl.getUniformLocation(pr, n);
    this.sun = [0.45, 0.62, 0.5]; this.sunCol = [1.0, 0.88, 0.72];
    this.fog = [0.66, 0.74, 0.82]; this.fogD = 0.0046;
    this.skyTop = [0.28, 0.48, 0.82]; this.skyHor = [0.78, 0.84, 0.90];
    this.view = M4.ident ? null : null;
    this.cam = [0, 5, -8];
    this.root = new Node('root');
    this.resize();
  }
  resize() {
    const c = this.canvas, dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.floor(c.clientWidth * dpr), h = Math.floor(c.clientHeight * dpr);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    this.aspect = c.width / c.height;
  }
  // Mesh: {pos, nor, col, idx}
  upload(m) {
    const gl = this.gl, vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const mkb = (data, loc, size) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); };
    mkb(new Float32Array(m.pos), 0, 3); mkb(new Float32Array(m.nor), 1, 3);
    const col = m.col ? new Float32Array(m.col) : new Float32Array(m.pos.length).fill(1);
    mkb(col, 2, 3);
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    const big = m.pos.length / 3 > 65535;
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, big ? new Uint32Array(m.idx) : new Uint16Array(m.idx), gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, n: m.idx.length, type: big ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
  }
  render(camPos, camTarget, fov) {
    const gl = this.gl; this.resize();
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.clearColor(this.fog[0], this.fog[1], this.fog[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
    const view = M4.look(camPos, camTarget), proj = M4.persp(fov * DEG, this.aspect, 0.15, 1500);
    const vp = M4.mul(proj, view);
    const u = this.u;
    gl.uniformMatrix4fv(u.uVP, false, vp); gl.uniform3fv(u.uSun, this.sun); gl.uniform3fv(u.uSunCol, this.sunCol);
    gl.uniform3fv(u.uCam, camPos); gl.uniform3fv(u.uFog, this.fog); gl.uniform1f(u.uFogD, this.fogD);
    gl.uniform3fv(u.uSkyTop, this.skyTop); gl.uniform3fv(u.uSkyHor, this.skyHor);
    this.root.update(null, null);
    const opaque = [], trans = [];
    const walk = (n) => {
      if (!n.visible) return;
      if (n.mesh) (n.alpha < 1 || n.additive ? trans : opaque).push(n);
      for (const c of n.children) walk(c);
    };
    walk(this.root);
    const draw = (n) => {
      gl.uniformMatrix4fv(u.uModel, false, n.world); gl.uniform3fv(u.uScale, n.ws);
      gl.uniform3fv(u.uColor, n.color); gl.uniform3fv(u.uEmis, n.emis); gl.uniform1f(u.uAlpha, n.alpha);
      gl.uniform1i(u.uMode, n.sky ? 2 : (n.unlit ? 1 : 0));
      gl.bindVertexArray(n.mesh.vao); gl.drawElements(gl.TRIANGLES, n.mesh.n, n.mesh.type, 0);
    };
    gl.depthMask(true); gl.disable(gl.BLEND);
    for (const n of opaque) draw(n);
    gl.enable(gl.BLEND); gl.depthMask(false);
    const d2 = (n) => { const dx = n.world[12] - camPos[0], dy = n.world[13] - camPos[1], dz = n.world[14] - camPos[2]; return dx * dx + dy * dy + dz * dz; };
    trans.sort((a, b) => d2(b) - d2(a));
    for (const n of trans) { gl.blendFunc(n.additive ? gl.SRC_ALPHA : gl.SRC_ALPHA, n.additive ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA); draw(n); }
    gl.depthMask(true);
  }
}

// ---------- Mesh üreticiler ----------
const Geo = (() => {
  function box() {
    const p = [], n = [], idx = []; const F = [[[1,0,0],[0,1,0],[0,0,1]],[[-1,0,0],[0,1,0],[0,0,-1]],[[0,1,0],[0,0,1],[1,0,0]],[[0,-1,0],[0,0,-1],[1,0,0]],[[0,0,1],[0,1,0],[-1,0,0]],[[0,0,-1],[0,1,0],[1,0,0]]];
    for (const [nn, u, v] of F) {
      const b = p.length / 3;
      for (const [a, c] of [[-1,-1],[1,-1],[1,1],[-1,1]]) p.push((nn[0]+u[0]*a+v[0]*c)*0.5,(nn[1]+u[1]*a+v[1]*c)*0.5,(nn[2]+u[2]*a+v[2]*c)*0.5), n.push(...nn);
      idx.push(b,b+1,b+2,b,b+2,b+3);
    }
    return { pos: p, nor: n, idx };
  }
  function sphere(lat = 10, lon = 14) {
    const p = [], n = [], idx = [];
    for (let i = 0; i <= lat; i++) { const t = i / lat * Math.PI, y = Math.cos(t), r = Math.sin(t);
      for (let j = 0; j <= lon; j++) { const a = j / lon * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r; p.push(x * .5, y * .5, z * .5); n.push(x, y, z); } }
    for (let i = 0; i < lat; i++) for (let j = 0; j < lon; j++) { const a = i * (lon + 1) + j, b = a + lon + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
    return { pos: p, nor: n, idx };
  }
  function cyl(seg = 12) {
    const p = [], n = [], idx = [];
    for (let j = 0; j <= seg; j++) { const a = j / seg * Math.PI * 2, x = Math.cos(a), z = Math.sin(a);
      p.push(x * .5, -.5, z * .5, x * .5, .5, z * .5); n.push(x, 0, z, x, 0, z); }
    for (let j = 0; j < seg; j++) { const a = j * 2; idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
    for (const s of [-1, 1]) { const c = p.length / 3; p.push(0, s * .5, 0); n.push(0, s, 0);
      for (let j = 0; j <= seg; j++) { const a = j / seg * Math.PI * 2; p.push(Math.cos(a) * .5, s * .5, Math.sin(a) * .5); n.push(0, s, 0); }
      for (let j = 0; j < seg; j++) idx.push(c, c + 1 + j, c + 2 + j); }
    return { pos: p, nor: n, idx };
  }
  function cone(seg = 9) { // taban y=0, uç y=1
    const p = [], n = [], idx = [];
    for (let j = 0; j <= seg; j++) { const a = j / seg * Math.PI * 2, x = Math.cos(a), z = Math.sin(a);
      p.push(x * .5, 0, z * .5, 0, 1, 0); const l = Math.hypot(1, .5); n.push(x / l, .5 / l, z / l, x / l, .5 / l, z / l); }
    for (let j = 0; j < seg; j++) idx.push(j * 2, j * 2 + 1, j * 2 + 2);
    const c = p.length / 3; p.push(0, 0, 0); n.push(0, -1, 0);

      const a = Math.random() * 6.283, sp = power * (0.4 + Math.random() * 0.8), s = 0.12 + Math.random() * 0.28;
      spawn(MESH.box, { p: [p[0] + Math.cos(a) * 1.2, p[1] + 0.2, p[2] + Math.sin(a) * 1.2], s0: [s, s, s], s1: [s * .6, s * .6, s * .6], dur: 0.9 + Math.random() * 0.5, color: [0.42 + Math.random() * .1, 0.4, 0.36], v: [Math.cos(a) * sp * .5, 3 + Math.random() * power * .5, Math.sin(a) * sp * .5], g: -16, lit: true, spin: 6, a0: 1 });
    }

      const n = it.n;
      if (it.orbit) { it.orbit.a += it.orbit.w * dt; n.p[0] = it.orbit.cx + Math.cos(it.orbit.a) * it.orbit.d; n.p[2] = it.orbit.cz + Math.sin(it.orbit.a) * it.orbit.d; n.p[1] += it.v[1] * dt; }
      else { it.v[1] += it.g * dt; n.p[0] += it.v[0] * dt; n.p[1] += it.v[1] * dt; n.p[2] += it.v[2] * dt; }
      if (it.lit) { const gy = groundY(n.p[0], n.p[2]); if (n.p[1] < gy + .05) { n.p[1] = gy + .05; it.v[0] *= .5; it.v[2] *= .5; it.v[1] = Math.abs(it.v[1]) * .2; } n.r[0] += it.spin * dt; n.r[2] += it.spin * dt; }
      for (let k = 0; k < 3; k++) n.s[k] = it.s0[k] + (it.s1[k] - it.s0[k]) * t;

    }
  }
  return { init, ring, arc, sparks, debris, vortex, update, spawn, BLUE, GOLD, RED, WHITE };
})();

// ===================== Girdi: klavye+fare ve DualSense/Xbox (otomatik geçiş) =====================
const Input = (() => {
  const keys = {}, pressedKeys = {}; let mdx = 0, mdy = 0, mouseL = false, mouseR = false;
  const ev = { attack: false, special: false, dodge: false, absorb: false, sprintPress: false, interact: false, pause: false, map: false, navUp: false, navDown: false, navLeft: false, navRight: false, confirm: false, back: false };
  let padPrev = [], device = 'kb', locked = false;
  const out = { move: [0, 0], look: [0, 0], sprintHeld: false, device: 'kb', ev };
  const cvs = () => document.getElementById('c');
  addEventListener('keydown', e => { if (e.repeat) return; keys[e.code] = true; pressedKeys[e.code] = true; device = 'kb';
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  addEventListener('mousemove', e => { if (document.pointerLockElement === cvs()) { mdx += e.movementX; mdy += e.movementY; device = 'kb'; } });
  addEventListener('mousedown', e => { if (!Game.running) return; if (document.pointerLockElement !== cvs()) { cvs().requestPointerLock && cvs().requestPointerLock(); return; }
    if (e.button === 0) { ev.attack = true; mouseL = true; } if (e.button === 2) { ev.special = true; mouseR = true; } device = 'kb'; });
  addEventListener('mouseup', e => { if (e.button === 0) mouseL = false; if (e.button === 2) mouseR = false; });
  addEventListener('contextmenu', e => e.preventDefault());
  const dz = (v, d = 0.18) => Math.abs(v) < d ? 0 : (v - Math.sign(v) * d) / (1 - d);
  function poll(dt) {
    dt = Math.min(0.05, dt || 0.016);
    // Klavye
    let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    let lx = 0, ly = 0;
    if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
    lx = mdx * 0.0022 * Settings.mouse + ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * 2.2 * dt; ly = mdy * 0.0022 * Settings.mouse + ((keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0)) * 1.4 * dt; mdx = mdy = 0;
    out.sprintHeld = !!(keys.ShiftLeft || keys.ShiftRight || keys.ControlLeft);
    if (pressedKeys.Space) ev.dodge = true; if (pressedKeys.KeyQ || pressedKeys.KeyF) ev.absorb = true;
    if (pressedKeys.KeyE) ev.interact = true; if (pressedKeys.Escape || pressedKeys.KeyP) ev.pause = true;
    if (pressedKeys.ArrowUp || pressedKeys.KeyW) ev.navUp = true; if (pressedKeys.ArrowDown || pressedKeys.KeyS) ev.navDown = true; if (pressedKeys.ArrowLeft || pressedKeys.KeyA) ev.navLeft = true; if (pressedKeys.ArrowRight || pressedKeys.KeyD) ev.navRight = true; if (pressedKeys.Enter) ev.confirm = true; if (pressedKeys.Tab || pressedKeys.KeyM) ev.map = true;
    if (pressedKeys.KeyJ) ev.attack = true; if (pressedKeys.KeyK) ev.special = true;
    for (const k in pressedKeys) delete pressedKeys[k];
    // Kumanda
    let pads = [], pad = null;
    if (!out.padBlocked) { try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { out.padBlocked = true; const t = document.getElementById('toast'); if (t) { t.textContent = 'Kumanda bu önizlemede kapalı. Dosyayı indirip Chrome veya Edge ile aç.'; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 8000); } } }
    for (const p of pads) if (p && p.connected) { pad = p; break; }
    if (pad) {
      const b = i => pad.buttons[i] && pad.buttons[i].pressed, was = i => padPrev[i];
      const edge = i => b(i) && !was(i);
      const rad = (x, y, d) => { const m = Math.hypot(x, y); if (m < d) return [0, 0]; const k = Math.min(1, (m - d) / (1 - d)) / m; return [x * k, y * k]; };
      const [sx, sy0] = rad(pad.axes[0] || 0, pad.axes[1] || 0, 0.2), sy = -sy0; const [rx0, ry0] = rad(pad.axes[2] || 0, pad.axes[3] || 0, 0.15);
      const rx = rx0 * Math.abs(rx0) * 0.6 + rx0 * 0.4, ry = ry0 * Math.abs(ry0) * 0.6 + ry0 * 0.4;
      const r2 = (pad.buttons[7] ? pad.buttons[7].value : 0) > 0.45;
      const any = sx || sy || rx || ry || pad.buttons.some(x => x.pressed);
      if (any) device = 'pad';
      if (device === 'pad') {
        if (Math.hypot(sx, sy) > 0) { mx = sx; my = sy; }
        lx += rx * 2.6 * dt * Settings.mouse; ly += ry * 1.8 * dt * Settings.mouse;
        if (r2 && !padPrev.r2) ev.attack = true;
        if (edge(3)) ev.special = true;            // Üçgen
        if (edge(1)) ev.dodge = true;              // Yuvarlak
        if (edge(2)) ev.absorb = true;             // Kare
        if (edge(0)) ev.interact = true;           // Çarpı
        if (edge(10)) ev.sprintPress = true;       // L3
        if (edge(9)) ev.pause = true; if (edge(8)) ev.map = true;
        if (edge(12) || (sy > 0.6 && !(padPrev.nu))) ev.navUp = true; if (edge(13) || (sy < -0.6 && !(padPrev.nd))) ev.navDown = true; if (edge(14) || (sx < -0.6 && !padPrev.nl)) ev.navLeft = true; if (edge(15) || (sx > 0.6 && !padPrev.nr)) ev.navRight = true;
        if (edge(0)) ev.confirm = true; if (edge(1)) ev.back = true;
      }
      padPrev = pad.buttons.map(x => x.pressed); padPrev.r2 = r2; padPrev.nu = sy > 0.6; padPrev.nd = sy < -0.6; padPrev.nl = sx < -0.6; padPrev.nr = sx > 0.6;
    }
    out.move = [mx, my]; out.look = [lx, ly]; out.device = device;
    return out;
  }
  function clear() { for (const k in ev) ev[k] = false; }
  const rumble = (a, b, ms) => { if (out.padBlocked) return; try { const pads = navigator.getGamepads(); for (const p of pads) if (p && p.vibrationActuator) p.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: a, weakMagnitude: b }); } catch (e) { } };
  addEventListener('gamepadconnected', e => { const t = document.getElementById('toast'); if (t) { t.textContent = 'Kumanda bağlandı: ' + e.gamepad.id.slice(0, 40); t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 3500); } });
  return { poll, clear, ev, rumble, get device() { return device; } };
})();

const Snd = (() => {
  let ctx = null, master = null, noise = null, wind = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = Settings.vol; master.connect(ctx.destination);
    const len = ctx.sampleRate; noise = ctx.createBuffer(1, len, ctx.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // Rüzgar
    const src = ctx.createBufferSource(); src.buffer = noise; src.loop = true; const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    const g = ctx.createGain(); g.gain.value = 0.06; src.connect(f); f.connect(g); g.connect(master); src.start();
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.12; const lg = ctx.createGain(); lg.gain.value = 160; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    wind = g;
  }
  function setVol() { if (master) master.gain.value = Settings.vol; }
  function tone(freq, dur, type, vol, slide, delay) {
    if (!ctx) return; const t = ctx.currentTime + (delay || 0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function burst(dur, f0, f1, vol, q, delay) {
    if (!ctx) return; const t = ctx.currentTime + (delay || 0), s = ctx.createBufferSource(); s.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  const S = {
    slash() { burst(0.22, 900, 3200, 0.35, 0.8); },
    sweep() { burst(0.3, 500, 2400, 0.4, 0.7); tone(180, 0.2, 'sawtooth', 0.05, 0.5); },
    slam() { burst(0.5, 300, 70, 0.7, 0.6, 0.18); tone(70, 0.5, 'sine', 0.6, 0.4, 0.2); },
    spin() { burst(0.55, 400, 2600, 0.45, 0.6); tone(220, 0.5, 'triangle', 0.08, 2.2); },
    burst() { tone(110, 1.1, 'sawtooth', 0.22, 3.5); burst(1.0, 200, 4000, 0.6, 0.5); tone(55, 1.2, 'sine', 0.6, 0.5, 0.3); },
    hit() { tone(140, 0.15, 'square', 0.25, 0.4); burst(0.12, 1500, 400, 0.3, 1); },
    shatter() { burst(0.5, 4500, 900, 0.5, 2); tone(1400, 0.3, 'triangle', 0.15, 0.5); tone(2100, 0.25, 'triangle', 0.1, 0.5, 0.05); },
    absorb() { tone(520, 0.4, 'sine', 0.18, 1.8); tone(780, 0.35, 'sine', 0.1, 1.6, 0.05); },
    absorbOk() { tone(880, 0.6, 'sine', 0.3, 1.5); tone(1320, 0.6, 'sine', 0.2, 1.5, 0.08); burst(0.4, 3000, 8000, 0.3, 2); },
    roll() { burst(0.4, 700, 200, 0.25, 0.6); },
    hurt() { tone(120, 0.3, 'sawtooth', 0.3, 0.5); burst(0.25, 600, 200, 0.4, 1); },
    telegraph() { tone(300, 0.5, 'sawtooth', 0.07, 1.6); },
    stomp() { tone(60, 0.45, 'sine', 0.8, 0.5); burst(0.4, 200, 60, 0.7, 0.5); },
    roar() { tone(90, 0.9, 'sawtooth', 0.25, 0.6); burst(0.9, 250, 90, 0.4, 0.8); },
    key() { tone(660, 0.25, 'sine', 0.25); tone(990, 0.5, 'sine', 0.25, 1, 0.12); tone(1320, 0.7, 'sine', 0.2, 1, 0.25); },
    gate() { tone(50, 2.2, 'sawtooth', 0.25, 0.7); burst(2.2, 200, 80, 0.5, 0.5); },

})();

class ActorAnim {
  constructor(model, biped) {

    this.fl = f('LegFL') || f('LegL'); this.fr = f('LegFR') || f('LegR'); this.bl = f('LegBL'); this.br = f('LegBR'); this.aL = f('Body/ArmL'); this.aR = f('Body/ArmR');
    this.cape = []; let c = f('Body/Cape0'); for (let i = 0; i < 3 && c; i++) { this.cape.push(c); c = c.children.find(x => x.name === 'Cape' + (i + 1)); }
    this.bodyBase = this.body ? this.body.p.slice() : [0, 0, 0]; this.phase = 0; this.move = 0; this.wind = 0; this.dead = 0; this.prev = null;
  }
  update(dt, pose, pos) {
    const R = (n, x, y, z) => { if (n) n.r = [x * DEG, (y || 0) * DEG, (z || 0) * DEG]; };
    const awake = pose.awake, moving = pose.moving, tele = pose.tele, strike = pose.strike, stagger = pose.stagger, dead = pose.dead, t = performance.now() / 1000;
    this.move += ((moving ? 1 : 0) - this.move) * (1 - Math.exp(-8 * dt)); this.phase += (moving ? 8 : 0) * dt; this.wind += ((tele ? 1 : 0) - this.wind) * (1 - Math.exp(-10 * dt)); this.dead += ((dead ? 1 : 0) - this.dead) * (1 - Math.exp(-4 * dt));
    const s = Math.sin(this.phase), br = Math.sin(t * (awake ? 2.4 : 1.2)), crouch = awake ? 0 : 0.12, shake = stagger ? Math.sin(t * 45) * 2.5 : 0;
    if (this.body) { const bob = Math.abs(Math.cos(this.phase)) * 0.06 * this.move, lunge = strike ? 0.25 : -0.2 * this.wind;
      this.body.p = [this.bodyBase[0], this.bodyBase[1] + bob + br * 0.015 - crouch + 0.15 * this.wind, this.bodyBase[2] + lunge]; R(this.body, -14 * this.wind + (strike ? 25 : 0) + shake + 6 * this.move, shake, 0); }
    this.m.r = [0, 0, 78 * DEG * this.dead]; this.m.p = [0, -0.25 * this.dead, 0];
    R(this.head, (strike ? 28 : -10 * this.wind) + br * 2 + (stagger ? 15 : 0), Math.sin(t * 0.8) * (awake ? 6 : 2)); R(this.jaw, tele ? 38 : (strike ? 5 : 8 + br * 4));
    const sw = 34 * this.move; R(this.fl, s * sw); R(this.br, s * sw); R(this.fr, -s * sw); R(this.bl, -s * sw);
    let arm = -s * 28 * this.move; if (tele) arm = -150 * this.wind; if (strike) arm = 70;
    R(this.aL, arm * (this.biped ? 1 : 0.6) + br, 0, 6); R(this.aR, (tele ? arm : -arm) + br, 0, -6);
    R(this.t0, 10 + Math.sin(t * 3) * 12, Math.sin(t * 2.2) * 20); R(this.t1, 6, Math.sin(t * 2.2 - 0.8) * 25);
    let spd = 0; if (this.prev) spd = Math.min(1, Math.hypot(pos[0] - this.prev[0], pos[2] - this.prev[2]) / Math.max(dt, 1e-4) / 5); this.prev = pos.slice();

  }
}

class Monster {

class Dummy extends Monster {
  constructor(p) {
    const m = buildGiantModel(0, 0.5); const root = pivot(Game.scene, 'Dummy', [0, 0, 0]); root.add(m.model);
    super(root, m.rocks, 0.7); this.pos = [p[0], groundY(p[0], p[2]), p[2]]; this.anim = new ActorAnim(m.model, true); this.state = 'idle'; this.stateEnd = performance.now() / 1000 + 2.5; this.hp = this.maxHp = 9999; this.hits = 0; this.absorbedCount = 0; this.name = 'Eğitim Golemi'; this.kind = 'dummy'; this.cycle = 4; this.shown = false; this.yaw = Math.PI;
  }
  isBrittle() { return false; } isAbsorbable() { return this.state === 'tele'; }
  hit() { this.hits++; this.flashT = 0.1; Snd.play('hit'); FX.sparks([this.pos[0], this.pos[1] + 1, this.pos[2]], 6, 4, FX.GOLD); }
  absorbed() { this.absorbedCount++; this.state = 'stagger'; this.stateEnd = performance.now() / 1000 + 1.5; }
  die() { }
  update(dt, pl) {
    if (!this.node.visible) return; const now = performance.now() / 1000; this.flashT = Math.max(0, this.flashT - dt);
    this.faceTo(pl.pos, dt, 2);
    if (this.state === 'idle' && now >= this.stateEnd && this.active) { this.state = 'tele'; this.stateEnd = now + 1.1; Snd.play('telegraph'); }
    else if (this.state === 'tele' && now >= this.stateEnd) { if (this.flatDist(pl.pos) < 3) pl.hurt(6, this.pos); this.state = 'recover'; this.stateEnd = now + 0.8; FX.ring(this.pos, .4, 3, .4, FX.RED); }
    else if ((this.state === 'recover' || this.state === 'stagger') && now >= this.stateEnd) { this.state = 'idle'; this.stateEnd = now + this.cycle; }
    this.tint(this.flashT > 0 ? [1, 1, 1] : (this.state === 'tele' ? [0.65 + 0.35 * Math.sin(now * 24), 0.15, 0.1] : this.state === 'stagger' ? [1, 0.85, 0.2] : ROCK)); this.setWarning(3, this.state === 'tele');
    this.anim.update(dt, { awake: true, moving: false, tele: this.state === 'tele', strike: this.state === 'recover', stagger: this.state === 'stagger' }, this.pos); this.sync();

}

GameEvents.on('boss_wake', b => { $('bossbar').style.display = 'block'; $('bossname').textContent = b.name; Sub.say('boss_wake'); });
GameEvents.on('boss_phase2', () => Sub.say('boss_p2'));
GameEvents.on('boss_dead', b => { Game.flags.bossDead = true; hideBoss(); Sub.say('boss_dead'); setTimeout(() => { dropKey(b.pos); save(); updateObjective(); }, 2600); });
GameEvents.on('died', () => { Game.state = 'dead'; $('fade').style.opacity = 1; setTimeout(respawn, 2600); });

// ---------- Ana güncelleme ----------
function update(rawDt) {
  const inp = Input.poll(rawDt);
  if (Input.ev.pause && performance.now() - (Game.lastPause || 0) > 400 && !($('settings').style.display === 'flex' || $('controls').style.display === 'flex')) { if (Game.state === 'play') pause(true); else if (Game.state === 'pause') pause(false); }
  if (Game.state === 'menu' || Game.state === 'pause' || Game.state === 'end') { MenuNav.update(); Input.clear(); updateCameraIdle(rawDt); return; }
  let dt = rawDt;
  if (Game.hitStopT > 0) { Game.hitStopT -= rawDt; dt = 0; } else if (Game.slowT > 0) { Game.slowT -= rawDt; dt = rawDt * Game.slowScale; }
  Game.stats.time += rawDt;
  // Kamera girdisi
  if (Game.state === 'play' || Game.state === 'dead') { Game.cam.yaw += inp.look[0]; Game.cam.pitch = Math.min(1.1, Math.max(-0.25, Game.cam.pitch + inp.look[1])); }
  if (Game.state === 'cine') { updateCine(rawDt); Input.clear(); }
  senol.update(dt, Game.state === 'play' ? inp : { move: [0, 0], look: [0, 0], sprintHeld: false });
  if (Game.state === 'play') { Game.tutInfo.moved += Math.hypot(senol.vel[0], senol.vel[2]) * dt; if (senol.sprintActive) Game.tutInfo.sprintT += dt; }
  for (const e of Game.enemies) e.update(dt, senol);
  FX.update(dt);
  // Eğitim
  if (Game.tutStep < TUT.length && Game.state === 'play') {
    const step = TUT[Game.tutStep]; $('prompt').textContent = step.text(); $('prompt').style.opacity = 1;
    if (step.id === 'absorb' && dummy) { dummy.node.visible = true; dummy.active = true; }
    if (step.done(Game)) { Game.tutStep++; Snd.play('ui'); if (Game.tutStep >= TUT.length) { Game.flags.tutorial = true; $('prompt').style.opacity = 0; Sub.say('tut_done'); if (dummy) { dummy.node.visible = false; dummy.dead = true; } save(); updateObjective(); }
      else { if (TUT[Game.tutStep].id === 'absorb' && dummy) { dummy.node.visible = true; dummy.active = true; dummy.stateEnd = performance.now() / 1000 + 1.0; } } }
  }
  // İlk düşman
  if (Game.state === 'play') for (const e of Game.enemies) if (e.kind === 'creature' && !e.dead && e.state !== 'idle') { Sub.say('first_enemy'); break; }
  // Mühürler, anahtar, kapı, portal
  let prompt = '';
  if (Game.state === 'play') {
    for (let i = 0; i < Game.seals.length; i++) { const s = Game.seals[i], d = Math.hypot(senol.pos[0] - s.x, senol.pos[2] - s.z);
      if (d < 3.2) { prompt = `${glyph('interact')}: Mührü etkinleştir`; if (Input.ev.interact) { Game.sealIdx = i; senol.heal(100); senol.res = Math.max(senol.res, 40); Snd.play('seal'); FX.ring([s.x, s.y, s.z], 0.5, 4, 0.8, FX.BLUE); FX.sparks([s.x, s.y + 1.5, s.z], 30, 5, FX.BLUE, 0); save(); Sub.say('seal', true); Game.sealMsg = 2; } } }
    if (keyNode) { const kd = Math.hypot(senol.pos[0] - keyNode.p[0], senol.pos[2] - keyNode.p[2]); if (kd < 2.6) { Game.flags.key = true; Game.scene.remove(keyNode); keyNode = null; Snd.play('key'); Sub.say('key'); save(); updateObjective(); } }
    const gd = Math.hypot(senol.pos[0] - 0, senol.pos[2] - 150);
    if (gd < 6 && !Game.flags.gate) { if (Game.flags.key) { prompt = `${glyph('interact')}: Kapıyı aç`; if (Input.ev.interact) openGate(); } else { prompt = 'Kapı mühürlü'; Sub.say('gate_locked'); } }
    if (Game.flags.gate && senol.pos[2] > 164 && Math.abs(senol.pos[0]) < 6) endGame();
    if (senol.hp > 0 && senol.hp < 30) Sub.say('low_hp');
    if (senol.res >= senol.resMax) Sub.say('special_ready');
  }
  if (prompt) { $('prompt').textContent = prompt; $('prompt').style.opacity = 1; } else if (Game.tutStep >= TUT.length) $('prompt').style.opacity = 0;
  Input.clear();
  Sub.update(rawDt);
  // Vael
  const tt = performance.now() / 1000; vael.pulse = Math.max(0, vael.pulse - rawDt * 1.5);
  const target = [senol.pos[0] - Math.cos(Game.cam.yaw) * -0.9 - Math.sin(Game.cam.yaw) * 0.5, senol.pos[1] + 2.35 + Math.sin(tt * 1.6) * 0.12, senol.pos[2] + Math.sin(Game.cam.yaw) * -0.9 - Math.cos(Game.cam.yaw) * 0.5];
  for (let i = 0; i < 3; i++) vael.pos[i] += (target[i] - vael.pos[i]) * (1 - Math.exp(-4 * rawDt));
  vael.node.p = vael.pos.slice(); vael.halo.p = vael.pos.slice(); const ps = 0.3 + vael.pulse * 0.2; vael.node.s = [ps, ps, ps]; const hs = 0.5 + vael.pulse * 0.4 + Math.sin(tt * 3) * 0.04; vael.halo.s = [hs, hs, hs];
  // Anahtar, portal, mühür animasyonu
  if (keyNode) { keyNode.p[1] = keyNode.base + Math.sin(tt * 2) * 0.2; keyNode.r = [0, tt * 1.5, 0]; }
  if (Game.portal) Game.portal.ring.r = [90 * DEG, tt * 0.5, 0]; for (const s of Game.seals) { s.cryst.r = [0, tt * 0.8, 0.3]; }
  if (Game.flags.gate && gate.leaf.p[1] > -5.5) gate.leaf.p[1] = Math.max(-5.5, gate.leaf.p[1] - rawDt * 2.2);
  // Boss çubuğu
  if (boss && boss.state !== 'dormant' && !boss.dead) $('bossfill').style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
  hud(); updateCamera(rawDt);
}
function openGate() {
  Game.flags.gate = true; Snd.play('gate'); Sub.say('gate_open'); Game.shake(0.6); updateObjective(); save();
  Game.state = 'cine'; Game.cine = { t: 0, dur: 6 }; document.body.classList.add('cine');
}
function updateCine(dt) { Game.cine.t += dt; if (Game.cine.t > Game.cine.dur) { Game.state = 'play'; document.body.classList.remove('cine'); } }
function endGame() {
  Game.state = 'end'; Sub.say('end1'); Sub.say('end2'); document.exitPointerLock && document.exitPointerLock();
  setTimeout(() => { $('fade').style.opacity = 1; }, 2500);
  setTimeout(() => { const m = Math.floor(Game.stats.time / 60), s = Math.floor(Game.stats.time % 60); $('endstats').textContent = `Süre ${m}:${String(s).padStart(2, '0')} · Yenilen yaratık ${Game.stats.kills} · Emilim ${Game.stats.absorbs} · Düşme ${Game.stats.deaths}`; $('end').style.display = 'flex'; }, 5200);
}

function hud() {
  $('hpfill').style.width = (senol.hp / senol.maxHp * 100) + '%'; const rf = senol.res / senol.resMax * 100; $('resfill').style.width = rf + '%'; $('resbar').classList.toggle('full', rf >= 99.9);
  $('hint').innerHTML = `<b>${glyph('attack')}</b> Saldır · <b>${glyph('special')}</b> Özel · <b>${glyph('dodge')}</b> Yuvarlan · <b>${glyph('absorb')}</b> Emilim · <b>${glyph('sprint')}</b> Hızlı koşu`;
}

// ---------- Kamera ----------
let camPos = [0, 5, -6], camTgt = [0, 1.5, 0];
function updateCamera(dt) {
  const c = Game.cam; let tgt = [senol.pos[0], senol.pos[1] + 1.55, senol.pos[2]], dist = c.dist, yaw = c.yaw, pitch = c.pitch, fov = 62;
  if (senol.sprintActive) { dist += 0.6; fov = 68; }
  if (Game.state === 'cine') { const k = Math.min(1, Game.cine.t / 1.2), look = [0, 4, 150]; tgt = [tgt[0] + (look[0] - tgt[0]) * k, tgt[1] + (look[1] - tgt[1]) * k, tgt[2] + (look[2] - tgt[2]) * k]; dist = 5.4 + 8 * k; pitch = 0.1; yaw = 0; }
  if (Game.state === 'dead') { dist += Math.min(2.5, senol.t * 1.2); }
  const cp = Math.cos(pitch), want = [tgt[0] - Math.sin(yaw) * cp * dist, tgt[1] + Math.sin(pitch) * dist, tgt[2] - Math.cos(yaw) * cp * dist];
  const gy = groundY(want[0], want[2]) + 0.7; if (want[1] < gy) want[1] = gy;
  const k = 1 - Math.exp(-14 * dt); for (let i = 0; i < 3; i++) { camPos[i] += (want[i] - camPos[i]) * k; camTgt[i] += (tgt[i] - camTgt[i]) * k; }
  Game.shakeAmt = Math.max(0, Game.shakeAmt - dt * 2.2); const sh = Game.shakeAmt * Game.shakeAmt * 0.6; const p = [camPos[0] + (Math.random() - .5) * sh, camPos[1] + (Math.random() - .5) * sh, camPos[2] + (Math.random() - .5) * sh];
  Game.view = { p, t: camTgt.slice(), fov };
}
function updateCameraIdle(dt) {
  const t = performance.now() / 1000;
  if (Game.state === 'menu') { Game.view = { p: [Math.sin(t * 0.08) * 40, 14 + Math.sin(t * 0.2) * 2, -30 + Math.cos(t * 0.08) * 12], t: [0, 6, 20], fov: 55 }; return; }
  if (senol) updateCamera(dt);
}

// ---------- Menüler ----------
function pause(on) {
  Game.lastPause = performance.now();
  if (on) { Game.state = 'pause'; $('pausemenu').style.display = 'flex'; document.exitPointerLock && document.exitPointerLock(); }
  else { Game.state = 'play'; $('pausemenu').style.display = 'none'; hideSub(); if (Input.device !== 'pad') { try { $('c').requestPointerLock(); } catch (e) { } } }
}
function hideSub() { $('controls').style.display = 'none'; $('settings').style.display = 'none'; }
function toMenu() { Game.state = 'menu'; Game.running = false; $('pausemenu').style.display = 'none'; $('end').style.display = 'none'; $('menu').style.display = 'flex'; $('hud').style.display = 'none'; $('fade').style.opacity = 0; document.body.classList.remove('cine'); document.exitPointerLock && document.exitPointerLock(); refreshMenu(); }
function refreshMenu() { $('btnContinue').style.display = loadSave() ? 'block' : 'none'; }
function controlsTable() {
  const rows = [['Hareket (yürüme)', 'W A S D', 'Sol çubuğu it'], ['Kamera', 'Fare (veya ok tuşları)', 'Sağ çubuk'], ['Hızlı koşu', 'Shift basılı tut', 'L3\'e bas + it (tırpan sırta geçer)'], ['Saldırı (rastgele sıra)', 'Sol tık / J', 'R2'], ['Özel saldırı (Rezonans dolu)', 'Sağ tık / K', '△'],
    ['Yerde yuvarlanma (kaçınma)', 'Boşluk', '○'], ['Rezonans Emilimi', 'Q / F', '□'], ['Etkileşim', 'E', '✕'], ['Duraklat', 'Esc / P', 'Start']];
  $('ctable').innerHTML = '<tr><th></th><th>Klavye + Fare</th><th>Kumanda (DualSense / Xbox)</th></tr>' + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
}
function bindUI() {
  $('btnNew').onclick = () => { Snd.init(); try { localStorage.removeItem('senol_save'); } catch (e) { } startGame(false); };
  $('btnContinue').onclick = () => startGame(true);
  const openC = () => { controlsTable(); $('controls').style.display = 'flex'; Snd.init(); Snd.play('ui'); };
  $('btnControls').onclick = openC; $('pControls').onclick = openC; $('closeControls').onclick = () => $('controls').style.display = 'none';
  const openS = () => { $('vol').value = Settings.vol; $('mouse').value = Settings.mouse; $('voice').checked = Settings.voice; $('settings').style.display = 'flex'; };
  $('btnSettings').onclick = openS; $('pSettings').onclick = openS; $('closeSettings').onclick = () => { $('settings').style.display = 'none'; };
  $('vol').oninput = e => { Settings.vol = +e.target.value; Snd.setVol(); Settings.save(); }; $('mouse').oninput = e => { Settings.mouse = +e.target.value; Settings.save(); };
  $('voice').onchange = e => { Settings.voice = e.target.checked; Settings.save(); if (Settings.voice) Snd.speak('Ben Vael. Sesimi duyuyorsun.'); };
  $('pResume').onclick = () => pause(false); $('pMenu').onclick = toMenu; $('endMenu').onclick = toMenu;
  document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && Game.state === 'play' && Input.device !== 'pad') pause(true); });
  refreshMenu();
}


// ---------- Menü gezinme (kumanda D-pad/sol çubuk + ✕/○, klavye ok + Enter) ----------
const MenuNav = { idx: 0, last: null,
  container() { for (const id of ['settings', 'controls', 'end', 'pausemenu', 'menu']) { const el = $(id); if (el && getComputedStyle(el).display !== 'none') return el; } return null; },
  items(c) { return Array.from(c.querySelectorAll('button,input')).filter(e => e.offsetParent !== null); },
  update() {
    const ev = Input.ev, c = this.container(); if (!c) return false;
    if (c.id === 'menu' && Game.state !== 'menu' && Game.state !== 'pause') return false;
    const items = this.items(c); if (!items.length) return false;
    if (this.last !== c) { this.last = c; this.idx = 0; }
    const any = ev.navUp || ev.navDown || ev.navLeft || ev.navRight || ev.confirm || ev.back;
    if (ev.navUp) this.idx = (this.idx + items.length - 1) % items.length; if (ev.navDown) this.idx = (this.idx + 1) % items.length;
    this.idx = Math.min(this.idx, items.length - 1); const cur = items[this.idx];
    items.forEach(e => e.classList.remove('focus')); if (Input.device === 'pad' || any) cur.classList.add('focus');
    if (cur.type === 'range' && (ev.navLeft || ev.navRight)) { const st = +cur.step || 0.1; cur.value = Math.min(+cur.max, Math.max(+cur.min, +cur.value + (ev.navRight ? st : -st))); cur.dispatchEvent(new Event('input')); }
    if (ev.confirm) { Snd.init(); cur.click(); }
    if (ev.back) { if (c.id === 'settings') $('closeSettings').click(); else if (c.id === 'controls') $('closeControls').click(); else if (c.id === 'pausemenu') pause(false); }
    if (any) Snd.play('ui');
    return true;
  }
};

// ---------- Başlat ----------
function frame(now) {
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
  try { update(dt); } catch (e) { console.error(e); window.__err = String(e && e.stack || e); }
  const v = Game.view || { p: [0, 10, -20], t: [0, 2, 0], fov: 60 }; if (Game.sky) Game.sky.p = v.p.slice(); R.render(v.p, v.t, v.fov);
  window.__frames = (window.__frames || 0) + 1; requestAnimationFrame(frame);
}
function boot() {
  try { R = new Renderer($('c')); } catch (e) { $('fatal').style.display = 'flex'; $('fatal').textContent = 'Bu tarayıcı WebGL2 desteklemiyor: ' + e.message; return; }
  initMeshes(); setupLevel(); bindUI(); Game.state = 'menu'; Game.view = null;
  R.fog = [0.66, 0.74, 0.82]; requestAnimationFrame(frame);
}
window.addEventListener('load', boot);

</script></body></html>
